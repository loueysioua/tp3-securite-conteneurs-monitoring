# ============================================================
# REDIS (avec MOT DE PASSE issu du Secret) + application Flask
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tp3
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999            # utilisateur "redis" de l'image : le conteneur
            runAsGroup: 999           # ne démarre JAMAIS en root (pas besoin de setuid)
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 6379
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tp3
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
# ============================================================
# DÉPLOIEMENT DE L'APPLICATION (image sécurisée)
# Points de sécurité :
#   - secrets injectés via secretKeyRef (jamais dans l'image)
#   - securityContext durci : non-root, FS en lecture seule,
#     pas d'escalade de privilèges, capabilities supprimées
#   - probes /health
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-demo
  namespace: tp3
  labels: { app: app-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: app-demo }
  template:
    metadata:
      labels: { app: app-demo }
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Sécurité au niveau pod : processus sans root, par défaut
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: tp3-app:secure
          imagePullPolicy: Never          # image importée localement dans k3s
          env:
            - name: APP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_API_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app-demo
  namespace: tp3
spec:
  type: NodePort
  selector: { app: app-demo }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
